<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Opening a second terminal for pass 3"><title>Opening a second terminal for pass 3</title><rect width="1000" height="540" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 5 — Getting a SECOND terminal, for pass 3</text><text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Pass 3 is run away from the agent. On purpose.</text><rect x="30" y="80" width="420" height="40" rx="6" fill="#eef1f4" stroke="#d5d9de" stroke-width="1.5"/><text x="52" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">File</text><text x="104" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">Edit</text><text x="156" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">Selection</text><text x="244" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">View</text><text x="302" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">Go</text><text x="348" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="700" text-anchor="start">Terminal</text><text x="424" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">Help</text><rect x="340" y="120" width="260" height="152" rx="6" fill="#ffffff" stroke="#d5d9de" stroke-width="2"/><rect x="348" y="128" width="244" height="32" rx="4" fill="#b3123b" stroke="#b3123b" stroke-width="1.5"/><text x="364" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="start">New Terminal</text><text x="364" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Split Terminal</text><text x="364" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Run Task…</text><text x="364" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Run Build Task…</text><defs><marker id="a28182" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="700" y1="144" x2="606" y2="144" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a28182)"/><text x="714" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">Terminal → New Terminal</text><text x="714" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">or  Ctrl + `  (backtick)</text><rect x="30" y="310" width="380" height="130" rx="8" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><text x="52" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa4ae" font-weight="700" text-anchor="start">TERMINAL 1</text><text x="52" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#7fd396" font-weight="400" text-anchor="start">› </text><text x="74" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">what topics do the papers…</text><text x="52" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ffd479" font-weight="700" text-anchor="start">THE AGENT</text><text x="140" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4ae" font-weight="400" text-anchor="start">— paste prompts here</text><rect x="440" y="310" width="380" height="130" rx="8" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><text x="462" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa4ae" font-weight="700" text-anchor="start">TERMINAL 2</text><text x="462" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#7fd396" font-weight="400" text-anchor="start">$ </text><text x="482" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">grep -ah '^title:' corpus/…</text><text x="462" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ffd479" font-weight="700" text-anchor="start">PLAIN TERMINAL</text><text x="590" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4ae" font-weight="400" text-anchor="start">— run the checks here</text><text x="30" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="600" text-anchor="start">Tell them apart by the prompt character:  ›  is the agent.  $  is the computer.</text><text x="30" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">The rule for pass 3: do not ask the agent whether the agent was right.</text></svg>
