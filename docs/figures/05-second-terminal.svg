<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="Opening a second terminal for pass 3"><title>Opening a second terminal for pass 3</title><rect width="1120" height="430" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 5 — Getting a SECOND terminal, for pass 3</text><text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Pass 3 is run away from the agent. On purpose.</text><rect x="30" y="80" width="620" height="34" rx="6" fill="#2d333a" stroke="#2d333a" stroke-width="1.5"/><text x="52" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4ae" font-weight="600" text-anchor="start">Problems   Output   Debug Console   TERMINAL   Ports</text><rect x="560" y="84" width="26" height="26" rx="4" fill="#3a4149" stroke="#3a4149" stroke-width="1.5"/><text x="573" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#dfe5ea" font-weight="700" text-anchor="middle">+</text><defs><marker id="a95935" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="760" y1="97" x2="596" y2="97" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a95935)"/><text x="774" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">Click the + at the top right</text><text x="774" y="99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">of the terminal panel.</text><text x="774" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">If the whole panel is gone: the ☰ menu at the</text><text x="774" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">top left, then Terminal, then New Terminal.</text><rect x="30" y="130" width="620" height="200" rx="8" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><rect x="500" y="130" width="150" height="200" rx="8" fill="#2d333a" stroke="#2d333a" stroke-width="1.5"/><text x="516" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa4ae" font-weight="700" text-anchor="start">TERMINALS</text><text x="516" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9aa4ae" font-weight="400" text-anchor="start">bash  (the agent)</text><rect x="506" y="198" width="138" height="26" rx="4" fill="#3a4149" stroke="#3a4149" stroke-width="1.5"/><text x="516" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#dfe5ea" font-weight="400" text-anchor="start">bash  (plain)</text><text x="52" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#7fd396" font-weight="400" text-anchor="start">@you ➜ /workspaces/asee-mw-2026-… (main) $</text><text x="52" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#dfe5ea" font-weight="400" text-anchor="start">grep -ah '^title:' corpus/papers/*.md | …</text><text x="52" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ffd479" font-weight="700" text-anchor="start">PLAIN TERMINAL — its line ends in $. Run the checks here.</text><defs><marker id="a25681" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="760" y1="214" x2="660" y2="214" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a25681)"/><text x="774" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">The new terminal REPLACES the view.</text><text x="774" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">The agent is still running: click</text><text x="774" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">an entry in this list to switch</text><text x="774" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">between the agent and the plain one.</text><text x="30" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="600" text-anchor="start">The agent is the terminal where you ran openclaw chat. The plain terminal's line ends in $.</text><text x="30" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">The rule for pass 3: do not ask the agent whether the agent was right.</text></svg>
