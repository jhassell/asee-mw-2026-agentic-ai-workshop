<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" role="img" aria-label="The Codespace layout: editor, explorer and terminal"><title>The Codespace layout: editor, explorer and terminal</title><rect width="1120" height="510" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 3 — Where things are, and the one distinction that matters</text><rect x="30" y="60" width="700" height="420" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="2"/><rect x="30" y="60" width="46" height="420" rx="10" fill="#eef1f4" stroke="#d5d9de" stroke-width="1.5"/><rect x="76" y="60" width="190" height="420" rx="0" fill="#f6f7f9" stroke="#d5d9de" stroke-width="1.5"/><text x="96" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b7580" font-weight="700" text-anchor="start">EXPLORER</text><text x="96" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">exercises/</text><text x="96" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">  pass-1…</text><text x="96" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">  pass-2…</text><text x="96" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">  pass-3…</text><text x="96" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">corpus/</text><text x="96" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">PRIMER.md</text><text x="96" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">README.md</text><text x="96" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">setup.sh</text><rect x="266" y="60" width="464" height="250" rx="0" fill="#ffffff" stroke="#d5d9de" stroke-width="1.5"/><rect x="266" y="60" width="464" height="36" rx="0" fill="#eef1f4" stroke="#d5d9de" stroke-width="1.5"/><text x="288" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">pass-2-specified.md</text><text x="292" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start"># Pass 2: ask well</text><text x="292" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start"></text><text x="292" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">Same task. Now with the three</text><text x="292" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">things the room just asked for…</text><rect x="266" y="310" width="464" height="170" rx="0" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><text x="288" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa4ae" font-weight="700" text-anchor="start">TERMINAL</text><text x="288" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#dfe5ea" font-weight="400" text-anchor="start">$ bash setup.sh</text><text x="288" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7fd396" font-weight="400" text-anchor="start">  READY.</text><text x="288" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#dfe5ea" font-weight="400" text-anchor="start">$ openclaw chat</text><text x="288" y="438" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7fd396" font-weight="400" text-anchor="start">› </text><rect x="300" y="428" width="9" height="15" fill="#dfe5ea"/><defs><marker id="a11987" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="800" y1="180" x2="600" y2="180" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a11987)"/><text x="814" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">THE EDITOR</text><text x="814" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">Files open here. This is where</text><text x="814" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">you read the exercises and</text><text x="814" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">where the agent's report appears.</text><defs><marker id="a68902" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="800" y1="400" x2="620" y2="400" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a68902)"/><text x="814" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">THE TERMINAL</text><text x="814" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">You type three things here all</text><text x="814" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">morning. After setup, THE AGENT</text><text x="814" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">LIVES HERE TOO — the › prompt is</text><text x="814" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">the agent, not the computer.</text><text x="814" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6b7580" font-weight="400" text-anchor="start">Confusing these two is the most</text><text x="814" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6b7580" font-weight="400" text-anchor="start">common mix-up in the room.</text></svg>
