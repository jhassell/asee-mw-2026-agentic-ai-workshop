<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" role="img" aria-label="The Codespace layout: editor, explorer and terminal"><title>The Codespace layout: editor, explorer and terminal</title><rect width="1120" height="510" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 3 — Where things are, and the one distinction that matters</text><rect x="30" y="60" width="700" height="420" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="2"/><rect x="30" y="60" width="46" height="420" rx="10" fill="#eef1f4" stroke="#d5d9de" stroke-width="1.5"/><rect x="76" y="60" width="190" height="420" rx="0" fill="#f6f7f9" stroke="#d5d9de" stroke-width="1.5"/><text x="96" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b7580" font-weight="700" text-anchor="start">EXPLORER</text><text x="96" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">&gt; .devcontainer</text><text x="96" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">&gt; .vscode</text><text x="96" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">&gt; corpus</text><text x="96" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">&gt; docs</text><text x="96" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">&gt; exercises</text><text x="96" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">  .gitignore</text><text x="96" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">  LICENSE</text><text x="96" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">  PRIMER.md</text><text x="96" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">  README.md</text><text x="96" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c2024" font-weight="400" text-anchor="start">  setup.sh</text><rect x="266" y="60" width="464" height="250" rx="0" fill="#ffffff" stroke="#d5d9de" stroke-width="1.5"/><text x="498" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="600" text-anchor="middle">Empty at first.</text><text x="498" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="middle">Click a file in the Explorer (exercises, then</text><text x="498" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="middle">pass-1-underspecified.md) to open it here.</text><rect x="266" y="310" width="464" height="170" rx="0" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><rect x="266" y="310" width="464" height="28" rx="0" fill="#2d333a" stroke="#2d333a" stroke-width="1.5"/><text x="288" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa4ae" font-weight="600" text-anchor="start">Problems   Output   Debug Console   TERMINAL   Ports</text><text x="708" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#dfe5ea" font-weight="700" text-anchor="start">+</text><text x="288" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6b7580" font-weight="400" text-anchor="start">Welcome to Codespaces! ...</text><text x="288" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#dfe5ea" font-weight="400" text-anchor="start">@you ➜ /workspaces/asee-mw-2026-… (main) $ bash setup.sh</text><text x="288" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7fd396" font-weight="400" text-anchor="start">  READY.</text><text x="288" y="432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#dfe5ea" font-weight="400" text-anchor="start">@you ➜ /workspaces/asee-mw-2026-… (main) $ openclaw chat</text><rect x="288" y="446" width="8" height="14" fill="#dfe5ea"/><defs><marker id="a11987" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="800" y1="180" x2="600" y2="180" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a11987)"/><text x="814" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">THE EDITOR</text><text x="814" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">Files open here. This is where</text><text x="814" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">you read the exercises and</text><text x="814" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">where the agent's report appears.</text><defs><marker id="a68902" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="800" y1="400" x2="620" y2="400" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a68902)"/><text x="814" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">THE TERMINAL</text><text x="814" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">Ignore the Welcome text; type on</text><text x="814" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">the line ending in $. After</text><text x="814" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">openclaw chat, THE AGENT LIVES</text><text x="814" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">HERE TOO — you talk to it here.</text><text x="814" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6b7580" font-weight="400" text-anchor="start">Confusing these two is the most</text><text x="814" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6b7580" font-weight="400" text-anchor="start">common mix-up in the room.</text></svg>
