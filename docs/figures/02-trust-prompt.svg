<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="The trust-this-folder prompt"><title>The trust-this-folder prompt</title><rect width="1000" height="320" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 2 — The trust prompt</text><text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Appears while the Codespace is starting. Say yes.</text><rect x="30" y="78" width="560" height="210" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="2"/><text x="56" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1c2024" font-weight="700" text-anchor="start">Do you trust the authors of the files in this folder?</text><text x="56" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Code in this folder can run automatically.</text><text x="56" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">asee-mw-2026-agentic-ai-workshop</text><rect x="56" y="206" width="250" height="44" rx="8" fill="#1f7a3d" stroke="#1f7a3d" stroke-width="1.5"/><text x="84" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="600" text-anchor="start">Yes, I trust the authors</text><rect x="322" y="206" width="210" height="44" rx="8" fill="#ffffff" stroke="#d5d9de" stroke-width="1.5"/><text x="348" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6b7580" font-weight="400" text-anchor="start">No, I don't trust</text><defs><marker id="a77542" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="700" y1="228" x2="315" y2="228" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a77542)"/><text x="714" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">Click this one.</text><text x="714" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">These are the workshop's own files.</text><text x="714" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">You are trusting this repository,</text><text x="714" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">not the AI. Different question.</text></svg>
