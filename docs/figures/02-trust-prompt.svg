<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 345" width="1060" height="345" role="img" aria-label="The trust-this-folder prompt"><title>The trust-this-folder prompt</title><rect width="1060" height="345" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 2 — The trust prompt</text><text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Appears when the terminal first starts. Until you answer it, the terminal</text><text x="30" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">stays blank and the bottom bar says Restricted Mode.</text><rect x="30" y="92" width="600" height="220" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="2"/><text x="56" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1c2024" font-weight="700" text-anchor="start">Do you trust the authors of the files in this folder?</text><text x="56" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Creating a terminal process requires executing code</text><text x="56" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">If you don't trust the authors of these files, we do not recommend</text><text x="56" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">continuing as the files may be malicious.</text><rect x="318" y="244" width="80" height="38" rx="6" fill="#ffffff" stroke="#d5d9de" stroke-width="1.5"/><text x="358" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="middle">Manage</text><rect x="408" y="244" width="76" height="38" rx="6" fill="#ffffff" stroke="#d5d9de" stroke-width="1.5"/><text x="446" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="middle">Cancel</text><rect x="494" y="244" width="132" height="38" rx="6" fill="#1f7a3d" stroke="#1f7a3d" stroke-width="1.5"/><text x="560" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">Trust Folder &amp; Continue</text><defs><marker id="a77053" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="740" y1="263" x2="636" y2="263" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a77053)"/><text x="754" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">Click the green one, on the right.</text><text x="754" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">These are the workshop's own files.</text><text x="754" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">The malicious-files warning is standard;</text><text x="754" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">you are trusting this repository, not the AI.</text></svg>
