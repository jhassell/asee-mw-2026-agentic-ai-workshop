<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 670" width="1240" height="670" role="img" aria-label="Entering the seat-card code in the terminal"><title>Entering the seat-card code in the terminal</title><rect width="1240" height="670" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 4 — Entering your seat-card code</text><text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">The single most-reported confusion. Nothing is broken.</text><rect x="30" y="78" width="640" height="322" rx="8" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><text x="54" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#6b7580" font-weight="400" text-anchor="start">==============================================</text><text x="54" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start"> From Chatbots to Agents — setup</text><text x="54" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#6b7580" font-weight="400" text-anchor="start">==============================================</text><text x="54" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">Workshop files: ef12ca7</text><text x="54" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">Exercise files are up to date.</text><text x="54" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7fd396" font-weight="400" text-anchor="start">✓ Agent installed — OpenClaw 2026.9.2</text><text x="54" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start"></text><text x="54" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">Type the 6-character code from your seat card, then press Enter.</text><text x="54" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">(Nothing shows as you type. The short code is echoed back once you</text><text x="54" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start"> press Enter, so you can check it landed. The long code on the back</text><text x="54" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start"> of the card also works — type it in carefully at this same prompt.)</text><text x="54" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">&gt; </text><rect x="66" y="380" width="9" height="15" fill="#dfe5ea"/><defs><marker id="a45160" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="880" y1="390" x2="690" y2="390" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a45160)"/><text x="894" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">NOTHING APPEARS HERE</text><text x="894" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">as you type. No dots, no</text><text x="894" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">asterisks, no movement.</text><text x="894" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">That is deliberate — the code</text><text x="894" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">is hidden so it cannot be read</text><text x="894" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">off your screen.</text><rect x="30" y="420" width="640" height="142" rx="8" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><text x="54" y="452" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">&gt; </text><text x="54" y="476" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#ffd479" font-weight="400" text-anchor="start">You entered: 4ANAC9</text><text x="54" y="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">Checking your code...</text><text x="54" y="524" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">Unlocking workshop materials...</text><text x="54" y="548" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7fd396" font-weight="400" text-anchor="start">✓ Code accepted.</text><defs><marker id="a98632" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="880" y1="500" x2="690" y2="500" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a98632)"/><text x="894" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f7a3d" font-weight="600" text-anchor="start">THEN you press Enter and it</text><text x="894" y="488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f7a3d" font-weight="600" text-anchor="start">ECHOES THE CODE BACK, so you</text><text x="894" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f7a3d" font-weight="600" text-anchor="start">can see it landed.</text><text x="30" y="592" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">Capitals do not matter, and common misreads (a G for a 6) are forgiven.</text><text x="30" y="612" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">Not accepted? The prompt comes back on its own: check the card and type it again.</text><text x="30" y="636" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">Still no? Turn the card over and TYPE the long code at the same prompt. Capitals matter there.</text></svg>
