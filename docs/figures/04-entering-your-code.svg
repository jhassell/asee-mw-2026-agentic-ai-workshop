<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 630" width="1240" height="630" role="img" aria-label="Entering the seat-card code in the terminal"><title>Entering the seat-card code in the terminal</title><rect width="1240" height="630" fill="#ffffff"/><text x="30" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#1c2024" font-weight="700" text-anchor="start">Figure 4 — Entering your seat-card code</text><text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">The single most-reported confusion. Nothing is broken.</text><rect x="30" y="78" width="640" height="300" rx="8" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><text x="54" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#6b7580" font-weight="400" text-anchor="start">==============================================</text><text x="54" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start"> From Chatbots to Agents — setup</text><text x="54" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#6b7580" font-weight="400" text-anchor="start">==============================================</text><text x="54" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">Workshop files: ef12ca7</text><text x="54" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">Exercise files are up to date.</text><text x="54" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7fd396" font-weight="400" text-anchor="start">✓ Agent installed — OpenClaw 2026.9.2</text><text x="54" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start"></text><text x="54" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">Type the 6-character code from your seat card,</text><text x="54" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">then press Enter.</text><text x="54" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">&gt; </text><rect x="66" y="332" width="9" height="15" fill="#dfe5ea"/><defs><marker id="a44900" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="880" y1="342" x2="690" y2="342" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a44900)"/><text x="894" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">NOTHING APPEARS HERE</text><text x="894" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">as you type. No dots, no</text><text x="894" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">asterisks, no movement.</text><text x="894" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">That is deliberate — the code</text><text x="894" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">is hidden so it cannot be read</text><text x="894" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b3123b" font-weight="600" text-anchor="start">off your screen.</text><rect x="30" y="400" width="640" height="118" rx="8" fill="#22272c" stroke="#22272c" stroke-width="1.5"/><text x="54" y="432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#dfe5ea" font-weight="400" text-anchor="start">&gt; </text><text x="54" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#ffd479" font-weight="400" text-anchor="start">You entered: 4ANAC9</text><text x="54" y="480" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#9aa4ae" font-weight="400" text-anchor="start">Checking your code...</text><text x="54" y="504" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7fd396" font-weight="400" text-anchor="start">✓ Code accepted.</text><defs><marker id="a16988" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="880" y1="460" x2="690" y2="460" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a16988)"/><text x="894" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f7a3d" font-weight="600" text-anchor="start">THEN you press Enter and it</text><text x="894" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f7a3d" font-weight="600" text-anchor="start">ECHOES THE CODE BACK, so you</text><text x="894" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f7a3d" font-weight="600" text-anchor="start">can see it landed.</text><text x="30" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">Case does not matter. Codes never contain O, 0, I, 1, L, S, Z, B or G,</text><text x="30" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">so there is nothing on the card you can misread into something else.</text><text x="30" y="596" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1c2024" font-weight="600" text-anchor="start">If it will not take: turn the card over and paste the long code instead.</text></svg>
