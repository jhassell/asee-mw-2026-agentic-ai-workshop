font-weight="400" text-anchor="start">Open in browser</text><text x="544" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Rename</text><text x="544" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7580" font-weight="400" text-anchor="start">Stop codespace</text><text x="544" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="700" text-anchor="start">Delete</text><defs><marker id="a42667" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3123b"/></marker></defs><line x1="880" y1="336" x2="700" y2="336" stroke="#b3123b" stroke-width="2.5" marker-end="url(#a42667)"/><text x="894" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">Click the … menu on the</text><text x="894" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">workshop Codespace, then</text><text x="894" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">Delete. Check it is gone</text><text x="894" y="357" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b3123b" font-weight="600" text-anchor="start">from the list.</text><text x="30" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="600" text-anchor="start">Save anything you want to keep FIRST — and do your-idea.md before this,</text><text x="30" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1c2024" font-weight="400" text-anchor="start">because it needs the papers, and the papers go with the Codespace.</text><text x="30" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">ASEE licensed these papers to us for the session only. Retiring the</text><text x="30" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">environment afterwards is the condition we agreed to.</text><text x="30" y="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7580" font-weight="400" text-anchor="start">Its own name is random — look for the repository name above it. Or, from inside the Codespace: ☰ &gt; My Codespaces.</text></svg>
